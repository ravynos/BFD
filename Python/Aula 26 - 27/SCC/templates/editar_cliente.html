{% extends "base.html" %}

{% block titulo %}Editar Cliente{% endblock %}

{% block conteudo %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        
        <div class="card shadow-lg border-0 rounded-3">
            
            <div class="card-header bg-warning text-dark text-center py-4">
                <div style="font-size: 3rem;" class="mb-2">✏️</div>
                <h3 class="card-title fw-bold mb-0">Editar Cliente</h3>
                <p class="mb-0 mt-1 opacity-75 fw-bold">ID: #{{ cliente['id'] }}</p>
            </div>

            <div class="card-body p-4 p-md-5">
                
                <form method="POST" action="{{ url_for('editar', id=cliente['id']) }}">
                    
                    <div class="mb-4">
                        <label for="nome" class="form-label fw-bold text-secondary">Nome Completo</label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="nome" 
                               name="nome" 
                               value="{{ cliente['nome'] }}" 
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="idade" class="form-label fw-bold text-secondary">Idade</label>
                        <input type="number" 
                               class="form-control form-control-lg" 
                               id="idade" 
                               name="idade" 
                               value="{{ cliente['idade'] }}" 
                               min="0" 
                               max="130"
                               required>
                    </div>

                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold shadow-sm">
                            Salvar Alterações
                        </button>
                        
                        <a href="{{ url_for('listar') }}" class="btn btn-outline-secondary btn-lg border-0">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
