{% extends "base.html" %}

{% block titulo %}Início{% endblock %}

{% block conteudo %}
    <div class="d-flex align-items-center justify-content-center" style="min-height: 75vh;">

        <div class="container text-center">
            <h1 class="display-5 mb-5 fw-bold text-white" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.7);">
                O que deseja fazer?
            </h1>

            <div class="row justify-content-center g-4">

                <div class="col-md-5 col-lg-4">
                    <div class="card shadow border-0 h-100 cartao-interativo bg-primary text-white">
                        <div class="card-body py-5 d-flex flex-column align-items-center justify-content-center">
                            <div style="font-size: 4rem;" class="mb-3">👤</div>
                            <h3 class="card-title fw-bold">Novo Cliente</h3>
                            <p class="card-text opacity-75">Cadastrar uma nova pessoa no sistema.</p>
                            <a href="{{ url_for('cadastrar') }}" class="stretched-link text-white text-decoration-none">
                                <span class="fw-bold">Acessar Cadastro &rarr;</span>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-5 col-lg-4">
                    <div class="card shadow border-0 h-100 cartao-interativo bg-dark text-white">
                        <div class="card-body py-5 d-flex flex-column align-items-center justify-content-center">
                            <div style="font-size: 4rem;" class="mb-3">📋</div>
                            <h3 class="card-title fw-bold">Lista de Clientes</h3>
                            <p class="card-text opacity-75">Consultar, editar ou remover cadastros.</p>
                            <a href="{{ url_for('listar') }}" class="stretched-link text-white text-decoration-none">
                                <span class="fw-bold">Ver Lista &rarr;</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
